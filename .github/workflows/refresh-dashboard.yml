name: Refresh sprint dashboard

on:
  schedule:
    - cron: '0 8,12,18 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sprint-dashboard-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Capture current public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_snapshot.py
      - name: Validate snapshot and JavaScript
        run: |
          python3 -m json.tool snapshot.json > /dev/null
          node --check app.js
          node --check data.js
      - name: Save refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot.json data.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public sprint snapshot"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html style.css app.js data.js snapshot.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
